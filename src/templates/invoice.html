<!DOCTYPE html>
<html>

<head>

<title>Invoice Center - Business OS</title>

<style>

body{
background:#020617;
color:white;
font-family:Arial;
padding:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:16px;
margin-top:20px;
}

.stat{
background:#0f172a;
padding:20px;
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #334155;
}

.badge{
padding:6px 12px;
border-radius:20px;
background:#16a34a;
}

button{
background:#2563eb;
color:white;
border:0;
padding:12px 18px;
border-radius:10px;
}

</style>

</head>


<body>


<h1>🧾 Invoice Center</h1>


<div class="grid">


<div class="stat">
<h3>Total Invoice</h3>
<h1 id="total">0</h1>
</div>


<div class="stat">
<h3>Paid</h3>
<h1 id="paid">0</h1>
</div>


<div class="stat">
<h3>Unpaid</h3>
<h1 id="unpaid">0</h1>
</div>


</div>



<div class="card">

<h2>Invoice History</h2>


<table>

<thead>

<tr>
<th>Invoice</th>
<th>Amount</th>
<th>Status</th>
</tr>

</thead>


<tbody id="invoiceTable">

</tbody>


</table>


</div>



<script>


async function loadInvoices(){

const token =
localStorage.getItem("access_token");


const res = await fetch(
"/invoices/",
{
headers:{
"Authorization":
"Bearer "+token
}
}
);


const data = await res.json();


const invoices =
data.invoices || [];


document.getElementById("total")
.innerText =
invoices.length;


document.getElementById("paid")
.innerText =
invoices.filter(
i=>i.status==="PAID"
).length;


document.getElementById("unpaid")
.innerText =
invoices.filter(
i=>i.status!=="PAID"
).length;



let html="";


invoices.forEach(i=>{


html += `

<tr>

<td>
${i.invoice_number}
</td>


<td>
${i.amount}
</td>


<td>

<span class="badge">
${i.status}
</span>

</td>


</tr>

`;

});


document.getElementById(
"invoiceTable"
).innerHTML=html;


}


loadInvoices();


</script>


</body>

</html>
