<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Create Business OS Account</title>

<style>

body{
background:#020617;
color:white;
font-family:Arial;
padding:25px;
}

.container{
max-width:450px;
margin:auto;
}

.card{
background:#111827;
padding:25px;
border-radius:25px;
border:1px solid #334155;
}

h1{
text-align:center;
}

input{
width:100%;
padding:14px;
margin-top:12px;
border-radius:15px;
border:none;
background:#1e293b;
color:white;
box-sizing:border-box;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border-radius:30px;
border:none;
background:#2563eb;
color:white;
font-weight:bold;
font-size:16px;
}

.badge{
text-align:center;
margin:15px;
padding:10px;
background:#1e40af;
border-radius:20px;
}

#message{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
🚀 Start Free Trial
</h1>

<div class="badge" id="typeBadge">
Loading...
</div>


<form id="signupForm">


<input type="hidden"
id="business_type_code">


<input
id="name"
placeholder="Business Name"
required>


<input
id="owner_name"
placeholder="Owner Name">


<input
id="email"
placeholder="Email"
required>


<input
id="password"
type="password"
placeholder="Password"
required>


<button type="submit">
Create Business Workspace
</button>


</form>


<div id="message"></div>


</div>

</div>


<script>

const params = new URLSearchParams(
window.location.search
);


const type =
params.get("type")
||
"ONLINE_SHOP";


document.getElementById(
"business_type_code"
).value = type;


document.getElementById(
"typeBadge"
).innerHTML =
"Selected Business : " + type;



document.getElementById(
"signupForm"
)
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const payload={

company_name:
document.getElementById("name").value,

full_name:
document.getElementById("owner_name").value,

email:
document.getElementById("email").value,

password:
document.getElementById("password").value,

business_type_code:
document.getElementById("business_type_code").value

};


document.getElementById("message").innerHTML =
"⏳ Creating Workspace...";


try{


const response = await fetch(
"/api/v4/auth/register",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify(payload)

});


const data =
await response.json();



if(response.ok){

document.getElementById("message").innerHTML =
"✅ Workspace Created";


setTimeout(
function(){

window.location.href="/login";

},
1500
);


}else{


document.getElementById("message").innerHTML =
"❌ "+JSON.stringify(data);


}


}catch(error){


document.getElementById("message").innerHTML =
"⚠️ Connection Error";


}



});


</script>


</body>
</html>
