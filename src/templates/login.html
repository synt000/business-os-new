<!DOCTYPE html>
<html>
<head>

<title>Business OS Login</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111827;
    font-family:Arial;
    color:white;
}

.box{
    width:320px;
    background:#1f2937;
    padding:25px;
    border-radius:15px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

#msg{
    margin-top:10px;
    color:#f87171;
}

</style>

</head>


<body>


<div class="box">

<h2>🚀 Business OS</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">


<button id="loginBtn" type="button">


<script>
document.getElementById("loginBtn").onclick=function(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    console.log("BUTTON CLICKED", email);
login(email,password).catch(err=>{
    console.error("LOGIN ERROR:", err);
});

};
</script>




<script src="/static/app.js?v=7"></script>

</body>

</html>
