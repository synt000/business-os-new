<html>
<head>
<title>Business OS</title>
<link rel="stylesheet" href="/static/style.css?v=21">
</head>

<body>

<h1>Business OS Enterprise</h1>

<div class="grid">

<div class="card">
<h2 id="products">Loading...</h2>
<p>Products</p>
</div>

<div class="card">
<h2 id="orders">Loading...</h2>
<p>Orders</p>
</div>

<div class="card">
<h2 id="customers">Loading...</h2>
<p>Customers</p>
</div>

<div class="card">
<h2 id="revenue">Loading...</h2>
<p>Revenue</p>
</div>

<div class="card">
<h2 id="profit">Loading...</h2>
<p>Profit</p>
</div>

<div class="card">
<h2 id="inventoryValue">Loading...</h2>
<p>Inventory Value</p>
</div>

</div>


<div class="card">

<h2>Control Center</h2>

<p>
Auth:
<span id="authStatus">
Loading...
</span>
</p>

<p>
Tenant:
<span id="tenantId">-</span>
</p>

<p id="errorBox"></p>

</div>


<div id="dynamicMenu" class="menu-buttons">

<div class="menu-buttons" id="dynamicMenu"></div>

<button id="logoutBtn">
Logout
</button>

</div>


<script src="/static/app.js?v=11"></script>


<script>

document.getElementById("authStatus").innerText =
localStorage.getItem("access_token")
?"JWT Authenticated"
:"Not Logged";


document.getElementById("tenantId").innerText =
localStorage.getItem("tenant_id") || "-";



async function loadDashboardKPI(){

    const token = localStorage.getItem("access_token");

    if(!token){
        document.getElementById("errorBox").innerText =
        "Login required";
        return;
    }


    try{

        const res = await fetch(
            "/api/v4/business/dashboard/kpi",
            {
                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        );


        if(!res.ok){
            const text = await res.text();
            throw new Error("API ERROR: " + res.status + " " + text);
        }


        const data = await res.json();


        document.getElementById("products").innerText =
        data.products ?? 0;


        document.getElementById("orders").innerText =
        data.orders ?? 0;


        document.getElementById("customers").innerText =
        data.customers ?? 0;


        document.getElementById("revenue").innerText =
        "$ " + (data.revenue ?? 0);


        document.getElementById("profit").innerText =
        "$ " + (data.profit ?? 0);


        document.getElementById("inventoryValue").innerText =
        "$ " + (data.inventory_value ?? 0);


    }catch(err){

        document.getElementById("errorBox").innerText =
        "Unable to load dashboard";

        console.log(err);

    }

}


window.onload = function(){

    loadDashboardKPI();

};


</script>


</body>
</html>
