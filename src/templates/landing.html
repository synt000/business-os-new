<style>

.public-businesses{

padding:80px 20px;
background:#020617;

}


.business-grid{

max-width:1100px;
margin:auto;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:25px;

}


.business-card{

background:
linear-gradient(
145deg,
rgba(30,41,59,.95),
rgba(15,23,42,.95)
);

border:

1px solid rgba(148,163,184,.15);

border-radius:24px;

padding:28px;

text-align:center;

transition:.3s;

}


.business-card:hover{

transform:translateY(-8px);

box-shadow:
0 20px 50px rgba(0,0,0,.4);

border-color:#2563eb;

}


.business-logo{

width:90px;

height:90px;

object-fit:cover;

border-radius:20px;

margin-bottom:20px;

}


.business-logo-placeholder{

width:90px;

height:90px;

margin:auto;

display:flex;

align-items:center;

justify-content:center;

font-size:45px;

background:#1e293b;

border-radius:20px;

margin-bottom:20px;

}


.business-card h3{

color:white;

font-size:22px;

margin-bottom:10px;

}


.business-type{

display:inline-block;

padding:6px 14px;

border-radius:20px;

background:#2563eb;

color:white;

font-size:13px;

font-weight:700;

}


.business-card p{

color:#94a3b8;

line-height:1.6;

margin:18px 0;

}


.business-link{

display:inline-block;

padding:12px 22px;

border-radius:12px;

background:#2563eb;

color:white;

text-decoration:none;

font-weight:700;

}


.business-link:hover{

background:#1d4ed8;

}


</style>


<style>

<style>
