<!DOCTYPE html>
<html>

<head>

<title>
Customer Profile
</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#020617;
color:white;
font-family:Arial;
padding:20px;
}


.card{
max-width:500px;
margin:auto;
background:#0f172a;
padding:20px;
border-radius:20px;
}


.kpi{
background:#1e293b;
padding:15px;
border-radius:15px;
margin:10px 0;
}


button{
background:#2563eb;
color:white;
border:0;
padding:12px;
border-radius:10px;
width:100%;
}

</style>

</head>


<body>


<div class="card">


<h2>
👤 Customer Profile
</h2>


<div class="kpi">

<h3>
{{ customer.customer_name }}
</h3>

<p>
📞 {{ customer.customer_phone }}
</p>

<p>
✉️ {{ customer.customer_email }}
</p>

</div>



<div class="kpi">

<h3>
💰 Total Spent
</h3>

<p>
<span id="spent">0 MMK</span>
</p>

</div>



<div class="kpi">

<h3>
🧾 Orders
</h3>

<p>
<span id="orders">0 Orders</span>
</p>

</div>



<div class="kpi">

<h3>
📅 Created
</h3>

<p>
{{ customer.created_at }}<br><br>🏆 <span id="rank">Bronze</span>
</p>

</div>


<button onclick="history.back()">
⬅ Back
</button>


</div>


</body>

</html>


<script>

async function loadAnalytics(){

let id="{{ customer.id }}";


let res = await fetch(
"/api/v4/customers/"+id+"/analytics"
);


let data = await res.json();


document.getElementById("spent").innerHTML =
data.total_spent+" MMK";


document.getElementById("orders").innerHTML =
data.total_orders+" Orders";


document.getElementById("rank").innerHTML =
data.rank;


}


loadAnalytics();

</script>
