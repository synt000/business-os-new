<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Select Business Type - Business OS</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
}

.container{
max-width:520px;
margin:auto;
padding:25px;
}

h1{
text-align:center;
}

.grid{
display:grid;
gap:18px;
margin-top:30px;
}

.card{

background:#111827;
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #334155;

}

.card a{

display:block;
margin-top:15px;
padding:14px;
background:#2563eb;
border-radius:30px;
color:white;
text-decoration:none;

}


.icon{

font-size:45px;

}

</style>

</head>


<body>


<div class="container">


<h1>
🚀 Choose Your Business
</h1>


<div class="grid">


<div class="card">

<div class="icon">🛒</div>

<h2>Online Shop</h2>

<p>
Products, Orders, Customers
</p>

<a href="/signup?type=ONLINE_SHOP">
Start
</a>

</div>



<div class="card">

<div class="icon">🎲</div>

<h2>2D Seller</h2>

<p>
Daily Records & Commission
</p>

<a href="/signup?type=2D_SELLER">
Start
</a>

</div>



<div class="card">

<div class="icon">💇</div>

<h2>Beauty Salon</h2>

<p>
Customers & Service Booking
</p>

<a href="/signup?type=BEAUTY_SALON">
Start
</a>

</div>



<div class="card">

<div class="icon">🏪</div>

<h2>Mini Mart</h2>

<p>
Stock & Retail Management
</p>

<a href="/signup?type=MINI_MART">
Start
</a>

</div>



<div class="card">

<div class="icon">🛠</div>

<h2>Service</h2>

<p>
Service Business Management
</p>

<a href="/signup?type=RENTAL_SERVICE">
Start
</a>

</div>


</div>


</div>


</body>
</html>
