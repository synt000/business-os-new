<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business OS - Products</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-950 text-white">

<div class="min-h-screen">

<header class="p-5 border-b border-gray-800">
    <h1 class="text-2xl font-bold">
        📦 Product Management
    </h1>
    <p class="text-gray-400 text-sm">
        Business OS Inventory Module
    </p>
</header>


<main class="p-5 space-y-6">


<section class="bg-gray-900 rounded-xl p-5">

<h2 class="text-xl font-bold mb-4">
➕ Register Product
</h2>


<div class="grid md:grid-cols-3 gap-3">


<input id="sku"
class="bg-gray-800 p-3 rounded"
placeholder="SKU Code">


<input id="name"
class="bg-gray-800 p-3 rounded"
placeholder="Product Name">


<input id="barcode"
class="bg-gray-800 p-3 rounded"
placeholder="Barcode">


<input id="stock"
type="number"
class="bg-gray-800 p-3 rounded"
placeholder="Stock Qty">


<input id="purchase"
type="number"
class="bg-gray-800 p-3 rounded"
placeholder="Purchase Price">


<input id="retail"
type="number"
class="bg-gray-800 p-3 rounded"
placeholder="Retail Price">


</div>


<button onclick="addProduct()"
class="mt-4 bg-blue-600 px-5 py-3 rounded-xl">
Save Product
</button>


</section>



<section class="bg-gray-900 rounded-xl p-5">


<div class="flex justify-between mb-4">

<h2 class="text-xl font-bold">
📋 Products
</h2>


<button onclick="loadProducts()"
class="bg-gray-700 px-4 py-2 rounded">
Refresh
</button>


</div>



<div id="list"
class="grid md:grid-cols-3 gap-4">

Loading...

</div>


</section>


</main>


</div>


<script src="/static/js/products.js"></script>

</body>
</html>
