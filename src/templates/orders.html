<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sales Orders - Business OS ERP</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
font-family:Arial,sans-serif;
background:#090D16;
}

.card{
background:rgba(17,24,39,.7);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(12px);
}
</style>


<style>
.order-modal {
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(5px);
}

.order-modal-card {
    background:#111827;
    color:white;
    width:90%;
    max-width:500px;
    margin:8% auto;
    padding:25px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    font-family:Inter,Arial;
}

.order-modal-card h2 {
    font-size:22px;
    margin-bottom:15px;
    color:#60a5fa;
}

.order-info {
    line-height:1.8;
    font-size:16px;
}

.order-items {
    margin-top:15px;
    padding:15px;
    background:#1f2937;
    border-radius:12px;
}

.order-close {
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>


<body class="text-gray-100 min-h-screen">


<div class="p-6">

<h1 class="text-2xl font-bold mb-6">
🛒 Sales Order Node
</h1>


<div class="grid md:grid-cols-3 gap-6">


<div class="card rounded-2xl p-6">


<h2 class="text-sm font-bold text-gray-400 mb-5">
<i class="fa-solid fa-cart-plus"></i>
Place Sales Order
</h2>



<form id="order-form">


<label class="text-xs text-gray-400">
Customer
</label>

<select id="customer_id"
class="w-full mt-2 mb-4 bg-gray-900 border border-gray-700 rounded-xl p-3">

<option>
Loading customers...
</option>

</select>



<select
id="product"
class="w-full mt-2 mb-4 bg-gray-900 border border-gray-700 rounded-xl p-3">
</select>

<div
id="stock"
class="text-sm text-blue-400 mb-4">
Stock: -
</div>

<label class="text-xs text-gray-400">
Quantity
</label>

<input
id="quantity"
type="number"
value="1"
min="1"
class="w-full mt-2 mb-4 bg-gray-900 border border-gray-700 rounded-xl p-3">



<label class="text-xs text-gray-400">
Unit Price
</label>

<input
id="price"
readonly
class="w-full mt-2 mb-4 bg-gray-900 border border-gray-700 rounded-xl p-3">



<button
class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-3 font-bold">

Process Order Invoice

</button>


</form>


<div id="toast"
class="mt-4 hidden p-3 rounded-xl text-sm">
</div>


</div>



<div class="md:col-span-2 card rounded-2xl p-6">


<div class="flex justify-between mb-5">

<h2 class="text-sm font-bold text-gray-400">
<i class="fa-solid fa-file-invoice"></i>
Corporate Invoice Journal
</h2>


<button id="refresh-btn"
class="bg-gray-800 px-4 py-2 rounded-xl text-xs">

Sync Journal

</button>


</div>



<table class="w-full text-sm">

<thead class="text-gray-500">

<tr>

<th class="text-left">
Order
</th>

<th>
Customer
</th>

<th>
Amount
</th>

<th>
Status
</th>

</tr>

</thead>


<tbody id="orders-table">

</tbody>


</table>


</div>


</div>


</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{
console.log("ORDERS JS START");

const token=localStorage.getItem("access_token"); console.log("ERP TOKEN:", token);

const product=document.getElementById("product");
const customer=document.getElementById("customer_id");
console.log("CUSTOMER ELEMENT:", customer);
const price=document.getElementById("price");
const stock=document.getElementById("stock");

let products=[];


async function loadProducts(){

console.log("PRODUCT FETCH START");

try{

const res=await fetch(
"/api/v4/business/products",
{
headers:{
"Authorization":"Bearer "+token
}
});

console.log("PRODUCT STATUS:", res.status);

const data=await res.json();

console.log("PRODUCT DATA:", data);

products=data.products||[];

product.innerHTML="";


products.forEach(p=>{

let o=document.createElement("option");

o.value=p.id;

o.textContent=p.name+" ("+p.sku+")";

o.dataset.price=p.retail_price;

o.dataset.stock=p.stock_qty;

product.appendChild(o);

});


updateProduct();

console.log("PRODUCT DATA:",data);

}catch(err){

console.log("PRODUCT LOAD ERROR:",err);

}

}



function updateProduct(){

let o=product.options[product.selectedIndex];

if(!o)return;

price.value=o.dataset.price;

stock.innerText="Available Stock: "+o.dataset.stock;

}



product.onchange=updateProduct;


async function loadCustomers(){

if(!token){

customer.innerHTML="";

let o=document.createElement("option");

o.textContent="Login required";

customer.appendChild(o);

return;

}

try{

const res=await fetch(
"/api/v4/business/customers",
{
headers:{
"Authorization":"Bearer "+token
}
}
);


const data=await res.json();

console.log("CUSTOMER DATA:", data);
console.log("CUSTOMER STATUS:", res.status);

console.log("CUSTOMER STATUS:", res.status);
console.log("CUSTOMER RESPONSE:", data);


customer.innerHTML="";


if(!res.ok){

let o=document.createElement("option");

o.textContent="Customer API Error";

customer.appendChild(o);

console.log("CUSTOMER ERROR:", data);

return;

}


const customers=data.customers || [];


if(customers.length===0){

let o=document.createElement("option");

o.value="";

o.textContent="No customers yet";

customer.appendChild(o);


}else{


customers.forEach(c=>{

let o=document.createElement("option");

o.value=c.id;

o.textContent=c.name;

customer.appendChild(o);

});

console.log("CUSTOMERS LOADED COUNT:", customers.length);

}


}catch(err){

customer.innerHTML="";

let o=document.createElement("option");

o.textContent="Customer Load Failed";

customer.appendChild(o);

console.log(err);

}

}


async function loadOrders(){

try{

const res=await fetch(
"/api/v4/business/orders/list",
{
headers:{
"Authorization":"Bearer "+token
}
});


const data=await res.json();


const table=document.getElementById("orders-table");

table.innerHTML="";


const orders = data.orders || data || [];


if(orders.length === 0){

table.innerHTML = `
<tr>
<td colspan="4" class="py-8 text-center text-gray-500">
🛒 No orders yet.<br>
Create your first order to start selling.
</td>
</tr>
`;

return;

}


orders.forEach(o=>{


table.innerHTML += `

<tr class="border-b border-gray-800">

<td class="py-3">
${o.order_number}
<button onclick="viewOrder('${o.id}')">
Detail
</button>
</td>

<td>
${o.customer_name || o.customer || "Customer"}
</td>

<td>
$${o.total_amount || 0}
</td>

<td>
<span class="px-2 py-1 rounded bg-gray-800">
${o.status}
</span>

${
o.status === "PENDING"
?
`<button
onclick="updateOrderStatus('${o.id}','CONFIRMED')"
class="ml-2 px-2 py-1 bg-blue-600 rounded text-xs">
Confirm
</button>`
:
o.status === "CONFIRMED"
?
`<button
onclick="updateOrderStatus('${o.id}','COMPLETED')"
class="ml-2 px-2 py-1 bg-green-600 rounded text-xs">
Complete
</button>`
:
``
}

</td>

</tr>

`;

});




}catch(err){

console.log("ORDER LOAD ERROR:",err);

}

}

document
.getElementById("order-form")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const payload={

order_number:
"ORD-"+Date.now(),

platform_channel:"POS",

customer_id:customer.value,

customer_name:
customer.options[customer.selectedIndex]?.text
||"Walk In Customer",

customer_phone:null,

items:[

{

product_id:product.value,

quantity:
parseInt(
document.getElementById("quantity").value
),

price:
parseFloat(
document.getElementById("price").value
)

}

]

};



const res=await fetch(

"/api/v4/business/orders/",

{

method:"POST",

headers:{

"Content-Type":"application/json",

"Authorization":"Bearer "+token

},

body:JSON.stringify(payload)

}

);



const data=await res.json();



const toast=document.getElementById("toast");


toast.classList.remove("hidden");


if(res.ok){

toast.className=
"mt-4 p-3 rounded-xl bg-green-900 text-green-300";


toast.innerText=
"✓ Order Created : "+data.order_number;


loadProducts();

loadOrders();


}else{


toast.className=
"mt-4 p-3 rounded-xl bg-red-900 text-red-300";


toast.innerText =
"✗ " + (
    Array.isArray(data.detail)
    ? data.detail.map(e => e.msg || JSON.stringify(e)).join("\n")
    : JSON.stringify(data.detail)
);


}



});



document
.getElementById("refresh-btn")
.onclick=loadOrders;



loadProducts();

loadCustomers();

loadOrders();



});



</script>


<script>
function closeOrderModal(){
    const modal = document.getElementById("orderModal");
    if(modal){
        modal.style.display="none";
    }
}
</script>
</body>
</html>

<script>

async function viewOrder(id){

const token = localStorage.getItem("access_token");

const res = await fetch(
"/api/v4/business/orders/detail/"+id,
{
headers:{
"Authorization":"Bearer "+token
}
}
);

const data = await res.json();

document.getElementById("orderDetail").innerHTML = `

<h3 style="font-size:20px;font-weight:700">
${data.order_number}
</h3>

<p>
Customer: ${data.customer_name || ""}
</p>

<p>
Status: ${data.status || ""}
</p>

<p>
Total: ${data.total_amount || 0}
</p>

<h4 style="margin-top:15px;font-weight:bold">
Items
</h4>

${
(data.items || []).map(i=>`

<div>
${i.product_name || "Product"}
 x ${i.quantity}
 -
 ${i.price}
</div>

`).join("")
}

`;

document.getElementById("orderModal").style.display="block";

}


function closeOrderModal(){

const modal=document.getElementById("orderModal");

if(modal){
modal.style.display="none";
}

}

</script>
